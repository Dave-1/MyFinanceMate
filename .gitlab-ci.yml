stages:
  - build
  - test

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
  ANDROID_HOME: "$HOME/android-sdk"
  ANDROID_SDK_ROOT: "$HOME/android-sdk"
  CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

image: eclipse-temurin:17-jdk

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - ~/.gradle/caches/
    - "$ANDROID_HOME"

before_script:
  - |
    set -e
    apt-get update && apt-get install -y --no-install-recommends wget unzip > /dev/null
    mkdir -p "$ANDROID_HOME/cmdline-tools"
    if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
      wget -q "$CMDLINE_TOOLS_URL" -O /tmp/clt.zip
      unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    fi
    yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
    "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
    export PATH="$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin"
    echo "Building $CI_COMMIT_REF_NAME"

build-debug:
  stage: build
  script:
    - ./gradlew :app:assembleDebug --stacktrace
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week

unit-tests:
  stage: test
  script:
    - ./gradlew :app:testDebugUnitTest
